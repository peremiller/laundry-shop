<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SudsFlow — Laundry Shop Manager</title>
<meta name="theme-color" content="#032943">
<link rel="icon" type="image/png" sizes="any" href="assets/sudsflow-logo-mark.png?v=2">
<link rel="shortcut icon" type="image/png" href="assets/sudsflow-logo-mark.png?v=2">
<link rel="apple-touch-icon" href="assets/sudsflow-logo-mark.png?v=2">
<link rel="preload" as="image" href="assets/laundry-basket-line.png">
<link rel="stylesheet" href="assets/icons/remixicon.css">
<style>
:root{
  --bg:#f4f8f9; --card:#ffffff; --ink:#0f1c24; --muted:#5f7480; --line:#dfe9ec;
  --brand:#0d9488; --brand-2:#14b8a6; --brand-soft:#ccfbf1; --brand-ink:#0f766e;
  --grad-a:#0f766e; --grad-b:#14b8a6;
  --ok:#059669; --ok-soft:#d1fae5; --warn:#d97706; --warn-soft:#fef3c7;
  --bad:#dc2626; --bad-soft:#fee2e2; --violet:#7c3aed; --violet-soft:#ede9fe;
  --slate:#475569; --slate-soft:#e2e8f0;
  --paper:#fffdfa; --paper-ink:#1c1917;
  --shadow:0 1px 2px rgba(15,28,36,.05),0 8px 16px -6px rgba(15,28,36,.07);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#07131a; --card:#101f28; --ink:#e4eef1; --muted:#8ba3ad; --line:#20343f;
    --brand:#2dd4bf; --brand-2:#14b8a6; --brand-soft:#0d3a36; --brand-ink:#7cf0e0;
    --grad-a:#0f5e57; --grad-b:#0d9488;
    --ok:#34d399; --ok-soft:#0a3327; --warn:#fbbf24; --warn-soft:#3a2c08;
    --bad:#f87171; --bad-soft:#450f0f; --violet:#a78bfa; --violet-soft:#271d43;
    --slate:#94a3b8; --slate-soft:#22303c;
    --paper:#f5f1e8; --paper-ink:#1c1917;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 10px 20px -8px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
button{font:inherit}

/* ---------- top bar & tabs ---------- */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(135deg,var(--grad-a) 0%,var(--grad-b) 100%);color:#fff;}
.topbar .logo{font-size:22px}
.topbar .ttl{font-weight:800;font-size:17px;letter-spacing:.2px;flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .sub{font-size:11px;opacity:.85;font-weight:500}
.topbar .icon{color:#fff;font-size:19px}
.tabs{display:flex;gap:4px;padding:8px 12px;position:sticky;z-index:29;
  top:calc(47px + env(safe-area-inset-top));
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(10px) saturate(1.15);-webkit-backdrop-filter:blur(10px) saturate(1.15);
  overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1;min-width:76px;border:0;background:transparent;color:var(--muted);
  padding:9px 10px;border-radius:10px;font-weight:600;font-size:13.5px;cursor:pointer;
  white-space:nowrap;transition:background .15s,color .15s}
.tab.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow)}
.screen{padding:6px 14px calc(96px + env(safe-area-inset-bottom));max-width:860px;margin:0 auto}

/* ---------- cards / generic ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.name{font-weight:700}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;
  padding:6px;border-radius:8px;min-width:34px;min-height:34px}
.icon:active{background:var(--slate-soft)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:10px;padding:11px 15px;
  font-weight:700;cursor:pointer;font-size:14.5px;transition:transform .1s ease}
.btn:active,.next:active,.addon:active,.chip:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.soft{background:var(--brand-soft);color:var(--brand-ink)}
.btn.ok{background:var(--ok)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .big{font-size:38px;margin-bottom:8px}
.chiprow{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chiprow::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;
  white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{width:100%;padding:10px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink);font-size:14px;margin-bottom:8px}
.search:focus{outline:2px solid var(--brand);border-color:transparent}

/* ---------- status pills ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;
  padding:3px 10px;font-size:11.5px;font-weight:700;letter-spacing:.2px}
.st-received{background:var(--slate-soft);color:var(--slate)}
.st-washing{background:var(--brand-soft);color:var(--brand-ink)}
.st-drying{background:var(--warn-soft);color:var(--warn)}
.st-folding{background:var(--violet-soft);color:var(--violet)}
.st-ready{background:var(--ok-soft);color:var(--ok)}
.st-claimed{background:var(--slate-soft);color:var(--muted)}
.pay-pill{border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700}
.pay-paid{background:var(--ok-soft);color:var(--ok)}
.pay-unpaid{background:var(--bad-soft);color:var(--bad)}

/* ---------- dashboard stats ---------- */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:13px 14px}
.stat .v{font-size:23px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted);font-weight:600}
.stat.accent{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0}
.stat.accent .v,.stat.accent .l{color:#fff}
.stat.accent .l{opacity:.85}
.sechead{display:flex;align-items:center;justify-content:space-between;
  margin:16px 2px 8px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.sechead .lnk{background:none;border:0;color:var(--brand);font-weight:700;
  font-size:13px;cursor:pointer}

/* ---------- order card ---------- */
.ocard{cursor:pointer;border-left:4px solid var(--line);transition:transform .1s ease}
.ocard:active{transform:scale(.98)}
.ocard.st-b-received{border-left-color:#64748b}
.ocard.st-b-washing{border-left-color:#0ea5e9}
.ocard.st-b-drying{border-left-color:#f59e0b}
.ocard.st-b-folding{border-left-color:#8b5cf6}
.ocard.st-b-ready{border-left-color:#10b981;animation:readypulse 2.4s ease-in-out infinite}
.ocard.st-b-claimed{border-left-color:var(--line);opacity:.62}
@keyframes readypulse{
  0%,100%{box-shadow:var(--shadow)}
  50%{box-shadow:0 0 0 3px rgba(16,185,129,.18),var(--shadow)}}
.ocode{font-weight:800;font-size:13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  background:var(--slate-soft);color:var(--ink);padding:2px 7px;border-radius:6px;
  letter-spacing:.3px;white-space:nowrap}
.oamt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.next{border:0;background:var(--brand-soft);color:var(--brand-ink);font-weight:700;
  border-radius:9px;padding:8px 12px;font-size:12.5px;cursor:pointer;white-space:nowrap}

/* ---------- forms ---------- */
label.f{display:block;margin:11px 0 0;font-size:12.5px;color:var(--muted);font-weight:600}
input,select,textarea{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:transparent}
.frow{display:flex;gap:10px}
.frow>*{flex:1}

/* ---------- new order builder ---------- */
.svcline{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.svcline select{flex:2.2;margin:0;min-width:150px}
.svcline .qtybox{display:flex;align-items:center;gap:0;flex:1.4;min-width:128px}
.svcline .qtybox input{margin:0;text-align:center;border-radius:0;border-left:0;border-right:0;
  font-variant-numeric:tabular-nums;font-weight:700;min-width:48px}
.qbtn{border:1px solid var(--line);background:var(--card);color:var(--brand);
  font-size:19px;font-weight:800;width:42px;height:43px;cursor:pointer;flex:0 0 auto}
.qbtn.minus{border-radius:10px 0 0 10px}
.qbtn.plus{border-radius:0 10px 10px 0}
.qbtn:active{background:var(--brand-soft)}
.svcline .amt{flex:1;text-align:right;font-weight:700;font-size:14px;
  font-variant-numeric:tabular-nums;min-width:64px}
.presets{display:flex;gap:6px;margin-top:7px}
.preset{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:8px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer}
.preset:active{background:var(--brand-soft);color:var(--brand-ink)}
.totalbar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;
  padding-top:12px;border-top:2px dashed var(--line)}
.totalbar .t{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.addonrow{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.addon{border:1.5px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.addon.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand-ink)}

/* ---------- stepper ---------- */
.stepper{display:flex;gap:0;margin:10px 0 4px}
.step{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--muted);position:relative;padding-top:18px}
.step::before{content:"";position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:var(--line)}
.step::after{content:"";position:absolute;top:10px;left:calc(-50% + 6px);right:calc(50% + 6px);
  height:2px;background:var(--line)}
.step:first-child::after{display:none}
.step.done::before,.step.done::after{background:var(--brand)}
.step.here::before{background:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.step.here{color:var(--brand)}

/* ---------- FAB / modal / toast ---------- */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;
  border:0;cursor:pointer;background:var(--brand);color:#fff;font-weight:800;font-size:15px;
  border-radius:999px;padding:15px 20px;box-shadow:0 4px 14px rgba(13,148,136,.45)}
.backdrop{position:fixed;inset:0;background:rgba(9,14,20,.5);display:flex;
  align-items:flex-end;justify-content:center;z-index:50}
.modal{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);
  border-radius:20px 20px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:92vh;overflow:auto;position:relative}
@media(min-width:560px){.backdrop{align-items:center;padding:20px}.modal{border-radius:20px}}
.modal h3{margin:2px 0 4px;font-size:18px}
.icon.close{position:absolute;top:10px;right:10px;z-index:2}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(10px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font-size:13px;font-weight:600;opacity:0;
  transition:.25s;z-index:70;pointer-events:none;max-width:86vw;text-align:center}
.toast.show{opacity:.96;transform:translateX(-50%) translateY(0)}

/* ---------- receipt / print ---------- */
.receipt{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;
  background:var(--paper);color:var(--paper-ink);padding:18px 14px;white-space:pre-wrap;
  position:relative;border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.18)}
.rcptwrap{filter:drop-shadow(0 3px 8px rgba(0,0,0,.25));margin:10px 0}
.rcptwrap .receipt{box-shadow:none;
  -webkit-mask:
    radial-gradient(circle at 6px -3px,transparent 6px,#000 6.5px) top/12px 10px repeat-x,
    radial-gradient(circle at 6px 13px,transparent 6px,#000 6.5px) bottom/12px 10px repeat-x,
    linear-gradient(#000,#000) center/100% calc(100% - 18px) no-repeat;
  mask:
    radial-gradient(circle at 6px -3px,transparent 6px,#000 6.5px) top/12px 10px repeat-x,
    radial-gradient(circle at 6px 13px,transparent 6px,#000 6.5px) bottom/12px 10px repeat-x,
    linear-gradient(#000,#000) center/100% calc(100% - 18px) no-repeat}
.claimtag{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;
  font-weight:900;text-align:center;letter-spacing:1px;margin:4px 0 8px;
  font-variant-numeric:tabular-nums}
#printRoot{display:none}
@media print{
  body>*{display:none !important}
  #printRoot{display:block !important;font-family:ui-monospace,Menlo,monospace;
    font-size:12px;white-space:pre-wrap;color:#000}
}

/* ---------- reports ---------- */
/* pipeline load strip */
.pipe{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none;
  padding-bottom:2px}
.pipe::-webkit-scrollbar{display:none}
.pipeseg{flex:1 0 auto;min-width:82px;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:9px 6px 8px;text-align:center;box-shadow:var(--shadow)}
.pipeseg .k{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.pipeseg .s{font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--muted);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pipeseg .dot{width:7px;height:7px;border-radius:50%;margin:0 auto 4px}
.pipeseg.empty-seg{opacity:.45}

.bar{height:9px;border-radius:6px;background:var(--brand);min-width:3px}
.bwrap{display:flex;align-items:center;gap:9px;margin:7px 0}
.blabel{width:118px;font-size:12.5px;color:var(--muted);font-weight:600;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0}
.bval{font-size:12.5px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ---------- professional desktop experience ---------- */
@font-face{
  font-family:"Manrope";
  src:url("assets/fonts/manrope-latin-variable.woff2") format("woff2-variations");
  font-style:normal;
  font-weight:200 800;
  font-display:swap;
}
:root{
  --bg:#f8f8f4;--card:#fffefa;--ink:#0b2440;--muted:#66788b;--line:#dfe7e4;
  --brand:#0b8f87;--brand-2:#16a89d;--brand-soft:#e0f6f1;--brand-ink:#08736d;
  --ok:#078a66;--ok-soft:#e1f5ea;--warn:#d97706;--warn-soft:#fff1d6;
  --bad:#d83b32;--bad-soft:#fde7e4;--violet:#7652bc;--violet-soft:#eee8fb;
  --slate:#53677c;--slate-soft:#e9eef1;--navy:#062f4b;--navy-deep:#032943;
  --paper:#fffdfa;--paper-ink:#16212c;
  --shadow:0 1px 2px rgba(6,47,75,.04),0 12px 28px -22px rgba(6,47,75,.3);
  --radius:13px;
}
html,body{min-height:100%}
body{background:var(--bg);font-family:"Manrope",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);font-size:14px;letter-spacing:-.01em;overflow-x:hidden}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:3px solid #07364d;outline-offset:3px;box-shadow:0 0 0 2px #fff}
@media (prefers-color-scheme: dark){
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
    outline-color:#fde68a;box-shadow:0 0 0 2px #09212d}
}

.app-shell{min-height:100vh;display:flex;background:var(--bg)}
.sidebar{position:sticky;top:0;align-self:flex-start;width:218px;height:100vh;flex:0 0 218px;
  padding:24px 16px 18px;display:flex;flex-direction:column;color:#eef9f8;
  background:var(--navy-deep);box-shadow:10px 0 28px -28px rgba(1,23,38,.9);z-index:35}
.brand-lockup{display:flex;align-items:center;gap:12px;padding:0 6px 22px}
.brand-mark{width:58px;height:58px;object-fit:contain;flex:0 0 auto;background:#fff;border-radius:50%;padding:3px;
  box-shadow:0 8px 24px -18px rgba(0,0,0,.65)}
.brand-copy{min-width:0}
.brand-name{font-size:19px;font-weight:800;line-height:1.08;letter-spacing:-.035em}
.brand-name span{display:block;color:#4be1d0}
.brand-tag{margin-top:5px;color:#b5d1d8;font-size:10px;line-height:1.3}
.side-nav{display:flex;flex-direction:column;gap:7px}
.side-nav .tab{flex:none;min-width:0;width:100%;display:flex;align-items:center;justify-content:flex-start;
  gap:12px;border:0;padding:12px 13px;border-radius:11px;background:transparent;color:#dcebef;
  font-size:14px;font-weight:650;box-shadow:none;transition:background .16s,color .16s,transform .16s}
.side-nav .tab i{font-size:20px;width:22px;text-align:center}
.side-nav .tab:hover{background:rgba(255,255,255,.07);color:#fff;transform:translateX(2px)}
.side-nav .tab.on{background:#0c8b86;color:#fff;box-shadow:0 10px 28px -22px #25d9c8}
.side-nav .tab.on i{color:#fff}
.sidebar-spacer{flex:1;min-height:26px}
.side-divider{height:1px;background:rgba(202,228,232,.22);margin:13px 2px}
.staff-card,.side-settings,.side-date{display:flex;align-items:center;gap:10px;padding:8px 6px;color:#ecf8f8}
.staff-avatar{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#20b9a9;
  color:#fff;font-weight:800;font-size:13px;box-shadow:0 8px 24px -16px #28e5d2}
.staff-copy{min-width:0;flex:1}
.staff-copy strong{display:block;font-size:13px}.staff-copy span{display:block;color:#b8d0d6;font-size:11px}
.side-settings{width:100%;border:0;background:transparent;border-radius:10px;cursor:pointer;font-weight:650;text-align:left}
.side-settings:hover{background:rgba(255,255,255,.07)}
.side-settings i,.side-date i{font-size:20px}
.side-date{align-items:flex-start;color:#c4d9de;font-size:11px;line-height:1.5}
.side-date span{display:block}

.workspace-area{min-width:0;flex:1}
.workspace-header{max-width:1420px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;
  gap:22px;padding:26px 24px 20px}
.page-intro{display:flex;align-items:center;gap:13px;min-width:0}
.greeting-icon{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;color:#f3a713;font-size:32px}
.page-eyebrow{color:var(--brand);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.09em}
.page-title{margin:3px 0 2px;font-size:29px;line-height:1.15;font-weight:800;letter-spacing:-.045em;color:var(--ink)}
.page-subtitle{margin:0;color:var(--muted);font-size:13px}
.header-actions{display:flex;align-items:center;gap:14px;flex:0 0 auto}
.header-date{display:flex;align-items:center;gap:8px;color:#40566b;font-weight:600;font-size:13px;white-space:nowrap}
.header-date i{font-size:18px;color:var(--navy)}
.primary-action{display:inline-flex;align-items:center;gap:9px;border:0;border-radius:11px;padding:12px 18px;
  background:var(--brand);color:#fff;box-shadow:0 12px 24px -18px rgba(5,108,102,.8);font-size:14px;font-weight:800;cursor:pointer}
.primary-action:hover{background:#087c75}.primary-action i{font-size:20px}
.screen{width:100%;max-width:1420px;margin:0 auto;padding:0 24px 38px}

.pipeline-pro{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--card);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px;margin-bottom:16px;overflow:visible;
  box-shadow:var(--shadow)}
.pipeline-pro .pipeseg{position:relative;min-width:0;display:flex;align-items:center;justify-content:center;gap:10px;

.stage-ready{color:#078a66}.stage-claimed{color:#53677c}

.kpi-grid{display:grid;grid-template-columns:1.35fr repeat(3,1fr);gap:12px;margin-bottom:16px}

  border-radius:7px;padding:6px 8px;font-size:9px;font-weight:800;white-space:nowrap;cursor:pointer}

.glance-panel{padding:0 15px;width:270px}.glance-title{padding:15px 0 11px;border-bottom:1px solid var(--line);font-size:15px;font-weight:800}

.glance-item:last-child{border-bottom:0}.glance-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#edf7f7;color:var(--brand);font-size:19px}
.glance-icon.bad{background:#fdebe8;color:var(--bad)}.glance-icon.ok{background:#e4f6ed;color:var(--ok)}

  .brand-lockup{padding:0}.brand-mark{width:38px;height:38px}.side-nav{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.side-nav .tab{padding:9px 6px}.side-nav .tab i{font-size:19px}.sidebar-spacer,.side-divider,.sidebar-foot{display:none}
  .workspace-header{padding:16px 14px 13px;align-items:flex-start}.page-eyebrow{display:none}.page-title{font-size:23px}.page-subtitle{font-size:11px}.header-date{display:none}
  .page-intro{gap:7px}.greeting-icon{width:34px;height:34px;font-size:27px}
  .primary-action{padding:10px 12px}.primary-action span{display:none}.screen{padding:0 14px 96px}.pipeline-pro{padding:10px 6px}.pipeline-pro .pipeseg{flex-basis:148px}
  .kpi-grid{grid-template-columns:1fr 1fr;gap:8px}.kpi{min-height:96px;padding:14px}.kpi-sales{grid-column:1/-1}.sales-illustration{width:92px;height:70px}.kpi-value{font-size:24px}.kpi-icon{width:42px;height:42px;font-size:22px}
  .panel-head{padding:12px}.ready-order{padding:12px}.orders-head{display:none}.order-data-row{grid-template-columns:68px minmax(0,1fr) 76px 20px;padding:10px 12px;gap:7px}
  .order-data-row .order-load,.order-data-row .stage-time,.order-data-row .payment-cell,.order-data-row .order-amount{display:none}.order-next{font-size:0;padding:8px}.order-next i{font-size:14px}
  .fab{display:block}.topbar{position:sticky}.screen>.stats{grid-template-columns:1fr 1fr}.frow{flex-direction:column}

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

<body>
<div id="app"></div>
<button id="fab" class="fab"><i class="ri-add-line"></i><span>New order</span></button>
<div id="modalRoot"></div>
<div id="toastRoot" role="status" aria-live="polite"></div>
<div id="printRoot"></div>
<script>
"use strict";
/* ============================== helpers ============================== */
const LS="sudsflow.v1";
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const todayISO=()=>new Date().toISOString().slice(0,10);
function toast(m){const r=$("#toastRoot"),e=document.createElement("div");e.className="toast";
  e.textContent=m;r.appendChild(e);requestAnimationFrame(()=>e.classList.add("show"));
  setTimeout(()=>{e.classList.remove("show");setTimeout(()=>e.remove(),250);},2200);}
function peso(n){const s=state.settings.currency||"₱";
  return s+Number(n||0).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});}
function fmtDT(ts){const d=new Date(ts);
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+
         d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});}
function ago(ts){const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return"just now"; if(m<60)return m+"m ago";
  const h=Math.round(m/60); if(h<24)return h+"h ago";
  return Math.round(h/24)+"d ago";}
const PH_TZ="Asia/Manila";
function phDate(){return new Intl.DateTimeFormat("en-PH",{
  timeZone:PH_TZ,weekday:"long",month:"long",day:"numeric",year:"numeric"
}).format(new Date());}
function phDateParts(){const parts=new Intl.DateTimeFormat("en-PH",{
  timeZone:PH_TZ,weekday:"long",month:"long",day:"numeric",year:"numeric"
}).formatToParts(new Date());
  const val=t=>(parts.find(p=>p.type===t)||{}).value||"";
  return{weekday:val("weekday"),date:`${val("month")} ${val("day")}, ${val("year")}`};}
function stageStartedAt(o){const log=Array.isArray(o.log)?o.log:[];
  const latest=log.slice().reverse().find(x=>x&&x.status===o.status&&x.at);
  return latest?latest.at:o.created;}
function elapsedShort(ts){const minutes=Math.max(0,Math.floor((Date.now()-ts)/60000));
  if(minutes<60)return`${Math.max(1,minutes)} min`;
  const hours=Math.floor(minutes/60);if(hours<24)return`${hours}h ${minutes%60}m`;
  return`${Math.floor(hours/24)}d ${hours%24}h`;}

/* ============================== data ============================== */
const STATUSES=[
  ["received","Received"],["washing","Washing"],["drying","Drying"],
  ["folding","Folding"],["ready","Ready"],["claimed","Claimed"]];
const STATUS_LABEL=Object.fromEntries(STATUSES);
const nextStatus=s=>{const i=STATUSES.findIndex(x=>x[0]===s);
  return i>=0&&i<STATUSES.length-1?STATUSES[i+1][0]:null;};

function defaultServices(){return[
  {id:uid(),name:"Wash • Dry • Fold",unit:"kg",rate:35,min:105},
  {id:uid(),name:"Wash & Dry only",unit:"kg",rate:30,min:90},
  {id:uid(),name:"Ironing / Press",unit:"kg",rate:45,min:90},
  {id:uid(),name:"Comforter / Blanket",unit:"pc",rate:180,min:0},
  {id:uid(),name:"Bedsheet / Curtain",unit:"pc",rate:80,min:0},
  {id:uid(),name:"Dry Cleaning",unit:"pc",rate:250,min:0},
];}
function defaultAddons(){return[
  {id:uid(),name:"Detergent",price:15},
  {id:uid(),name:"Fabric softener",price:12},
  {id:uid(),name:"Color care / bleach",price:20},
  {id:uid(),name:"Rush (same day)",price:60},
  {id:uid(),name:"Delivery",price:40},
];}

function normalize(s){s=s||{};
  s.settings=s.settings||{};
  s.settings.shopName=s.settings.shopName||"SudsFlow Laundry";
  s.settings.currency=s.settings.currency||"₱";
  s.settings.phone=s.settings.phone||"";
  s.settings.address=s.settings.address||"";
  s.settings.footer=s.settings.footer||"Thank you! Please keep this receipt.";
  s.services=Array.isArray(s.services)&&s.services.length?s.services:defaultServices();
  s.addons=Array.isArray(s.addons)&&s.addons.length?s.addons:defaultAddons();
  s.customers=Array.isArray(s.customers)?s.customers:[];
  s.orders=Array.isArray(s.orders)?s.orders:[];
  s.counter=s.counter||1001;
  s.orders.forEach(o=>{o.items=o.items||[];o.addons=o.addons||[];
    o.discount=o.discount||0;o.status=o.status||"received";o.log=Array.isArray(o.log)?o.log:[];});
  return s;}

function seed(){
  const now=Date.now(),H=3600000;
  const c1={id:uid(),name:"Maria Santos",phone:"0917 555 0101",notes:"Prefers unscented detergent",created:now-90*24*H};
  const c2={id:uid(),name:"Jun Dela Cruz",phone:"0918 555 0202",notes:"",created:now-40*24*H};
  const c3={id:uid(),name:"Kat Reyes",phone:"0999 555 0303",notes:"Office uniforms weekly",created:now-12*24*H};
  const sv=defaultServices(),ad=defaultAddons();
  const mk=(cust,items,addons,status,hrsAgo,paid)=>{
    const sub=items.reduce((a,i)=>a+i.amount,0)+addons.reduce((a,x)=>a+x.price,0);
    return{id:uid(),code:"",customerId:cust.id,items,addons,
      subtotal:sub,discount:0,total:sub,paid,payMethod:paid?"Cash":"",
      status,created:now-hrsAgo*H,due:todayISO(),notes:"",log:[]};};
  const it=(s,q)=>({serviceId:s.id,name:s.name,unit:s.unit,rate:s.rate,qty:q,
    amount:Math.max(s.rate*q,s.min||0)});
  const st={seeded:true,settings:{},services:sv,addons:ad,
    customers:[c1,c2,c3],counter:1001,orders:[]};
  const o1=mk(c1,[it(sv[0],7)],[ad[0],ad[1]],"ready",26,true);
  const o2=mk(c2,[it(sv[0],5),it(sv[3],1)],[ad[0]],"washing",3,false);
  const o3=mk(c3,[it(sv[2],4)],[],"received",1,false);
  const o4=mk(c2,[it(sv[0],6)],[ad[0]],"claimed",76,true);
  [o4,o1,o2,o3].forEach(o=>{o.code="LS-"+(st.counter++);st.orders.push(o);});
  return st;}

function boot(){try{const r=localStorage.getItem(LS);if(r)return normalize(JSON.parse(r));}catch(e){}
  return normalize(seed());}
let state=boot();
localStorage.setItem(LS,JSON.stringify(state));
function save(){localStorage.setItem(LS,JSON.stringify(state));}

const custById=id=>state.customers.find(c=>c.id===id);
const orderTotal=o=>Math.max(0,(o.subtotal||0)-(o.discount||0));

/* ============================== routing ============================== */
const VALID_VIEWS=new Set(["dash","orders","customers","reports"]);
function viewFromUrl(){
  const requested=new URL(window.location.href).searchParams.get("tab");
  return VALID_VIEWS.has(requested)?requested:"dash";
}
let view=viewFromUrl();   // stable tab deep links, existing / URL remains Dashboard
let workspace=null;       // {type:"order"|"customer"|"neworder", id}
let orderFilter="active"; // active | all | one of STATUSES
let orderQuery="";
function go(t){
  if(!VALID_VIEWS.has(t))return;
  workspace=null;view=t;
  const target=new URL(window.location.href);
  if(t==="dash")target.searchParams.delete("tab");
  else target.searchParams.set("tab",t);
  if(target.href!==window.location.href)window.history.pushState({sudsflowTab:t},"",target.href);
  render();
}
function back(){workspace=null;render();}
window.addEventListener("popstate",()=>{
  workspace=null;view=viewFromUrl();render();
});

const TABS=[
  ["dash","Dashboard","ri-dashboard-2-line"],
  ["orders","Orders","ri-file-list-3-line"],
  ["customers","Customers","ri-team-line"],
  ["reports","Reports","ri-bar-chart-2-line"]
];
const PAGE_META={
  dash:{eyebrow:"Operations",title:"Magandang araw, Staff!",subtitle:"Here’s a clear view of today’s laundry flow."},
  orders:{eyebrow:"Work queue",title:"Laundry orders",subtitle:"Track every load from intake to customer pickup."},
  customers:{eyebrow:"Customer care",title:"Customers",subtitle:"Keep customer details and order history close at hand."},
  reports:{eyebrow:"Business overview",title:"Reports",subtitle:"Review sales, services, and operational performance."}
};

function render(){
  const app=$("#app");
  if(workspace&&workspace.type==="neworder"){app.innerHTML=renderNewOrder();}
  else if(workspace&&workspace.type==="order"){app.innerHTML=renderOrderDetail(workspace.id);}
  else if(workspace&&workspace.type==="customer"){app.innerHTML=renderCustomerDetail(workspace.id);}
  else{
    const meta=PAGE_META[view];
    const date=phDateParts();
    const newCustomer=view==="customers";
    app.innerHTML=`
      <div class="app-shell">
        <aside class="sidebar">
          <div class="brand-lockup">
            <img class="brand-mark" src="${document.querySelector('link[rel="icon"]')?.href||''}" alt="">
            <div class="brand-copy">
              <div class="brand-name">SudsFlow <span>Laundry</span></div>
              <div class="brand-tag">Clean clothes.<br>Clear workflow.</div>
            </div>
          </div>
          <nav class="side-nav" aria-label="Primary navigation">
            ${TABS.map(([k,l,icon])=>`<button class="tab ${view===k?'on':''}" data-tab="${k}" ${view===k?'aria-current="page"':''}>
              <i class="${icon}" aria-hidden="true"></i><span>${l}</span></button>`).join("")}
          </nav>
          <div class="sidebar-spacer"></div>
          <div class="sidebar-foot">
            <div class="staff-card"><div class="staff-avatar">ST</div>
              <div class="staff-copy"><strong>Staff</strong><span>Front Desk</span></div></div>
            <div class="side-divider"></div>
            <button class="side-settings" id="sideSettings"><i class="ri-settings-3-line" aria-hidden="true"></i><span>Settings</span></button>
            <div class="side-divider"></div>
            <div class="side-date"><i class="ri-calendar-line" aria-hidden="true"></i><span>${esc(date.weekday)}<br>${esc(date.date)}</span></div>
          </div>
        </aside>
        <section class="workspace-area">
          <header class="workspace-header">
            <div class="page-intro">
              ${view==="dash"?`<div class="greeting-icon"><i class="ri-sun-line" aria-hidden="true"></i></div>`:""}
              <div>
                ${view!=="dash"?`<div class="page-eyebrow">${meta.eyebrow}</div>`:""}
                <h1 class="page-title">${meta.title}</h1>
                <p class="page-subtitle">${meta.subtitle}</p>
              </div>
            </div>
            <div class="header-actions">
              <div class="header-date"><i class="ri-calendar-line" aria-hidden="true"></i>${esc(phDate())}</div>
              <button class="primary-action" id="headerPrimary" data-action="${newCustomer?'customer':'order'}">
                <i class="ri-add-line" aria-hidden="true"></i><span>${newCustomer?'New customer':'New order'}</span></button>
            </div>
          </header>
          <main class="screen">${
            view==="dash"?renderDash():
            view==="orders"?renderOrders():
            view==="customers"?renderCustomers():renderReports()
          }</main>
        </section>
      </div>`;
  }
  wire();renderFab();
}

/* ============================== dashboard ============================== */
const STATUS_ICON={received:"ri-inbox-archive-line",washing:"ri-loader-4-line",drying:"ri-drop-line",
  folding:"ri-shirt-line",ready:"ri-checkbox-circle-line",claimed:"ri-shopping-bag-3-line"};
function orderLoad(o){const kg=o.items.filter(i=>i.unit==="kg").reduce((a,i)=>a+Number(i.qty||0),0);
  const pcs=o.items.filter(i=>i.unit==="pc").reduce((a,i)=>a+Number(i.qty||0),0);
  return[kg?`${kg%1?kg.toFixed(1):kg} kg`:"",pcs?`${pcs} pc`:""].filter(Boolean).join(" + ")||"—";}
function renderReadyOrder(o){const c=custById(o.customerId)||{name:"Walk-in"};
  return `<div class="ready-order" data-openorder="${o.id}"><div>

function renderDash(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const todays=state.orders.filter(o=>o.created>=t0.getTime());
  const sales=todays.reduce((a,o)=>a+orderTotal(o),0);
  const inprog=state.orders.filter(o=>["received","washing","drying","folding"].includes(o.status));
  const ready=state.orders.filter(o=>o.status==="ready");
  const unpaid=state.orders.filter(o=>!o.paid&&o.status!=="claimed");
  const unpaidAmt=unpaid.reduce((a,o)=>a+orderTotal(o),0);
  const claimed=state.orders.filter(o=>o.status==="claimed");
  const claimedAvg=claimed.length?elapsedShort(Date.now()-claimed.reduce((a,o)=>a+(Date.now()-o.created),0)/claimed.length):"—";
  const activeStages=new Set(inprog.map(o=>o.status)).size;
  const readyAmt=ready.reduce((a,o)=>a+orderTotal(o),0);
  const recent=state.orders.slice().sort((a,b)=>b.created-a.created).slice(0,5);
  const pipe=STATUSES.map(([k,l],idx)=>{
    const os=state.orders.filter(o=>o.status===k);
    const kg=os.reduce((a,o)=>a+o.items.filter(i=>i.unit==="kg")
      .reduce((x,i)=>x+Number(i.qty||0),0),0);
    return `<div class="pipeseg stage-${k} ${os.length?"":"empty-seg"}" title="${os.length} order(s) in ${l.toLowerCase()}">
      <div class="stage-icon"><i class="${STATUS_ICON[k]}" aria-hidden="true"></i></div>
      <div class="stage-copy"><div class="k">${kg%1?kg.toFixed(1):kg}<span class="muted" style="font-size:10px"> kg</span></div>
      <div class="s">${l} · ${os.length}</div></div><div class="stage-underline"></div>
      ${idx<STATUSES.length-1?`<i class="stage-arrow ri-arrow-right-s-line" aria-hidden="true"></i>`:""}</div>`;}).join("");
  return `
    <div class="pipeline-pro">${pipe}</div>
    <div class="kpi-grid">
      <div class="kpi kpi-sales"><div><div class="kpi-label">Today’s sales</div><strong class="kpi-value">${peso(sales)}</strong>
        <div class="kpi-meta">${todays.filter(o=>o.paid).length} paid order${todays.filter(o=>o.paid).length===1?'':'s'} today</div></div>
        <img class="sales-illustration" src="${document.querySelector('link[rel="preload"][as="image"]')?.href||''}" alt=""></div>
      <div class="kpi"><div><div class="kpi-label">Orders today</div><strong class="kpi-value">${todays.length}</strong><div class="kpi-meta">New loads received</div></div>
        <div class="kpi-icon"><i class="ri-file-list-3-line" aria-hidden="true"></i></div></div>
      <div class="kpi"><div><div class="kpi-label">In progress</div><strong class="kpi-value">${inprog.length}</strong><div class="kpi-meta">Across 4 active stages</div></div>
        <div class="kpi-icon"><i class="ri-timer-line" aria-hidden="true"></i></div></div>
      <div class="kpi kpi-unpaid"><div><div class="kpi-label">Unpaid</div><strong class="kpi-value">${peso(unpaidAmt)}</strong><div class="kpi-meta">${unpaid.length} open balance${unpaid.length===1?'':'s'}</div></div>
        <div class="kpi-icon"><i class="ri-wallet-3-line" aria-hidden="true"></i></div></div>
    </div>
    <div class="dash-layout"><div class="dash-main">
      <section class="panel ready-panel"><div class="panel-head"><div class="panel-title"><i class="ri-checkbox-circle-line" aria-hidden="true"></i><div>
        <strong>Ready for pickup ${ready.length?`<span class="pill st-ready">${ready.length}</span>`:""}</strong><span>Orders waiting at the counter</span></div></div>
        <button class="panel-link" data-tab="orders">View all <i class="ri-arrow-right-line" aria-hidden="true"></i></button></div>
        ${ready.length?ready.slice(0,2).map(renderReadyOrder).join(""):`<div class="empty"><div class="big"><i class="ri-checkbox-circle-line"></i></div>Nothing is waiting for pickup.</div>`}</section>
      <section class="panel orders-panel"><div class="panel-head"><div class="panel-title"><i class="ri-file-list-3-line" aria-hidden="true"></i><div>
        <strong>Active orders</strong><span>Recent loads across every stage</span></div></div>
        <button class="panel-link" data-tab="orders">View all <i class="ri-arrow-right-line" aria-hidden="true"></i></button></div>
        <div class="orders-head"><span>Order</span><span>Customer</span><span>Load</span><span>Stage</span><span>Time in stage</span><span>Payment</span><span>Amount</span><span>Action</span><span></span></div>
        ${recent.length?recent.map(renderOrderDataRow).join(""):`<div class="empty"><div class="big"><i class="ri-inbox-line"></i></div>No orders yet.</div>`}</section>
      </div><aside class="panel glance-panel"><div class="glance-title">At a glance</div>
        <div class="glance-item"><div class="glance-icon"><i class="ri-file-list-3-line"></i></div><div class="glance-copy"><span>Orders today</span><strong>${todays.length}</strong></div><div class="glance-detail">${todays.length}<strong>received</strong></div></div>
        <div class="glance-item"><div class="glance-icon"><i class="ri-timer-line"></i></div><div class="glance-copy"><span>In progress</span><strong>${inprog.length}</strong></div><div class="glance-detail">${activeStages}<strong>stages</strong></div></div>

}

  const c=custById(o.customerId)||{name:"Walk-in"};
  const kg=o.items.filter(i=>i.unit==="kg").reduce((a,i)=>a+Number(i.qty||0),0);
  const pcs=o.items.filter(i=>i.unit==="pc").reduce((a,i)=>a+Number(i.qty||0),0);
  const load=[kg?kg+" kg":"",pcs?pcs+" pc":""].filter(Boolean).join(" + ")||"—";
  const nx=nextStatus(o.status);
  return `<div class="card ocard st-b-${o.status}" data-openorder="${o.id}">
    <div class="row">
      <div class="grow">
        <div class="row" style="gap:8px">
          <span class="ocode">${esc(o.code)}</span>
          <span class="pill st-${o.status}">${STATUS_LABEL[o.status]}</span>
          <span class="pay-pill ${o.paid?'pay-paid':'pay-unpaid'}">${o.paid?"PAID":"UNPAID"}</span>
        </div>
        <div class="muted small" style="margin-top:3px">${esc(c.name)} · ${load} · ${ago(o.created)}</div>
      </div>
      <div>
        <div class="oamt">${peso(orderTotal(o))}</div>
        ${nx&&o.status!=="claimed"?`<button class="next" data-adv="${o.id}">${STATUS_LABEL[nx]} <i class="ri-arrow-right-line" aria-hidden="true"></i></button>`:""}
      </div>
    </div>
  </div>`;
}

function renderOrders(){
  const counts={active:0};
  STATUSES.forEach(([k])=>counts[k]=0);
  state.orders.forEach(o=>{counts[o.status]++;
    if(o.status!=="claimed")counts.active++;});
  const chips=[["active","Active"],["all","All"],...STATUSES].map(([k,l])=>
    `<button class="chip ${orderFilter===k?'on':''}" data-filter="${k}" aria-pressed="${orderFilter===k?'true':'false'}">${l}${
      k==="all"?` ${state.orders.length}`:counts[k]?` ${counts[k]}`:""}</button>`).join("");
  let list=state.orders.slice().sort((a,b)=>b.created-a.created);
  if(orderFilter==="active")list=list.filter(o=>o.status!=="claimed");
  else if(orderFilter!=="all")list=list.filter(o=>o.status===orderFilter);
  if(orderQuery){const q=orderQuery.toLowerCase();
    list=list.filter(o=>{const c=custById(o.customerId);
      return o.code.toLowerCase().includes(q)||(c&&c.name.toLowerCase().includes(q))||
             (c&&c.phone&&c.phone.replace(/\s/g,"").includes(q.replace(/\s/g,"")));});}
  return `
    <input class="search" id="orderSearch" aria-label="Search orders" placeholder="Search code, name, or phone…" value="${esc(orderQuery)}">
    <div class="chiprow">${chips}</div>
    ${list.map(orderCard).join("")||`<div class="empty"><div class="big"><i class="ri-inbox-line"></i></div>No matching orders.</div>`}`;
}

function advance(id){
  const o=state.orders.find(x=>x.id===id);if(!o)return;
  const nx=nextStatus(o.status);if(!nx)return;
  o.status=nx;o.log=Array.isArray(o.log)?o.log:[];o.log.push({status:nx,at:Date.now()});save();render();
  toast(o.code+" → "+STATUS_LABEL[nx]);
}

function notifyText(o){
  const c=custById(o.customerId)||{name:""};
  return `Hi ${c.name.split(" ")[0]}! Your laundry (${o.code}) at ${state.settings.shopName} is ${
    o.status==="ready"?"READY for pickup":"now "+STATUS_LABEL[o.status].toLowerCase()}. Total: ${peso(orderTotal(o))}${o.paid?" (paid)":""}. Thank you!`;
}
function openNotify(o){
  const c=custById(o.customerId)||{};
  const msg=notifyText(o);
  openModal(`<h3>Notify customer</h3>
    <div class="receipt" style="margin:10px 0">${esc(msg)}</div>
    <div class="row" style="gap:8px">
      <button class="btn sm" id="copyMsg">Copy text</button>
      ${c.phone?`<a class="btn sm soft" style="text-decoration:none"
        href="sms:${esc(c.phone.replace(/\s/g,""))}?&body=${encodeURIComponent(msg)}">Open SMS</a>`:""}
    </div>`);
  $("#copyMsg").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(msg);
    toast("Copied");};
}

/* ============================== receipt ============================== */
function receiptText(o){
  const c=custById(o.customerId)||{name:"Walk-in"};
  const W=32,line="-".repeat(W);
  const pad=(l,r)=>{l=String(l);r=String(r);
    const sp=Math.max(1,W-l.length-r.length);return l+" ".repeat(sp)+r;};
  let t="";
  t+=center(state.settings.shopName,W)+"\n";
  if(state.settings.address)t+=center(state.settings.address,W)+"\n";
  if(state.settings.phone)t+=center(state.settings.phone,W)+"\n";
  t+=line+"\n";
  t+=pad("Order",o.code)+"\n";
  t+=pad("Date",fmtDT(o.created))+"\n";
  t+=pad("Customer",c.name)+"\n";
  t+=pad("Status",STATUS_LABEL[o.status])+"\n";
  t+=line+"\n";
  o.items.forEach(i=>{t+=i.name+"\n"+pad(`  ${i.qty} ${i.unit} x ${peso(i.rate)}`,peso(i.amount))+"\n";});
  o.addons.forEach(a=>{t+=pad("+ "+a.name,peso(a.price))+"\n";});
  if(o.discount)t+=pad("Discount","-"+peso(o.discount))+"\n";
  t+=line+"\n";
  t+=pad("TOTAL",peso(orderTotal(o)))+"\n";
  t+=pad("Payment",o.paid?("PAID"+(o.payMethod?" ("+o.payMethod+")":"")):"UNPAID")+"\n";
  t+=line+"\n";
  t+=center(state.settings.footer,W)+"\n";
  return t;
  function center(s,w){s=String(s);if(s.length>=w)return s;
    const l=Math.floor((w-s.length)/2);return " ".repeat(l)+s;}
}
function openReceipt(o){
  const txt=receiptText(o);
  openModal(`<h3>Receipt</h3>
    <div class="rcptwrap"><div class="receipt">
      <div class="claimtag">${esc(o.code)}</div>${esc(txt)}</div></div>
    <div class="row" style="gap:8px">
      <button class="btn sm" id="printBtn"><i class="ri-printer-line"></i> Print</button>
      <button class="btn sm soft" id="copyRcpt">Copy</button>
    </div>`);
  $("#printBtn").onclick=()=>{$("#printRoot").textContent=txt;window.print();};
  $("#copyRcpt").onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(txt);toast("Copied");};
}

/* ============================== new order ============================== */
let draft=null;
function startDraft(customerId){
  draft={customerId:customerId||"",items:[{serviceId:state.services[0].id,qty:""}],
    addonIds:[],discount:"",paid:false,payMethod:"Cash",notes:""};
  workspace={type:"neworder"};render();
}
function draftTotals(){
  let sub=0;
  draft.items.forEach(it=>{
    const s=state.services.find(x=>x.id===it.serviceId);if(!s)return;
    const q=parseFloat(it.qty)||0;
    if(q>0)sub+=Math.max(s.rate*q,s.min||0);
  });
  draft.addonIds.forEach(id=>{const a=state.addons.find(x=>x.id===id);if(a)sub+=a.price;});
  const disc=parseFloat(draft.discount)||0;
  return{sub,disc,total:Math.max(0,sub-disc)};
}

    .map(c=>`<option value="${c.id}" ${draft.customerId===c.id?"selected":""}>${esc(c.name)}${c.phone?" · "+esc(c.phone):""}</option>`).join("");

  return `
    <header class="topbar">

function refreshDraftTotals(){
  const{sub,disc,total}=draftTotals();
  const el=$("#d-total");if(el)el.textContent=peso(total);
  const se=$("#d-sub");if(se)se.textContent="Subtotal "+peso(sub)+(disc?" − "+peso(disc):"");
  draft.items.forEach((it,i)=>{
    const s=state.services.find(x=>x.id===it.serviceId);if(!s)return;
    const q=parseFloat(it.qty)||0;
    const a=$(`[data-line-amt="${i}"]`);
    if(a)a.textContent=peso(q>0?Math.max(s.rate*q,s.min||0):0);
    const inp=$(`[data-line-qty="${i}"]`);
    if(inp)inp.placeholder=s.unit;
  });
}
function saveDraft(){
  const items=[];
  draft.items.forEach(it=>{
    const s=state.services.find(x=>x.id===it.serviceId);
    const q=parseFloat(it.qty)||0;
    if(s&&q>0)items.push({serviceId:s.id,name:s.name,unit:s.unit,rate:s.rate,qty:q,
      amount:Math.max(s.rate*q,s.min||0)});
  });
  if(!items.length){toast("Add at least one service with a quantity");return;}
  const addons=draft.addonIds.map(id=>state.addons.find(a=>a.id===id))
    .filter(Boolean).map(a=>({id:a.id,name:a.name,price:a.price}));
  const sub=items.reduce((a,i)=>a+i.amount,0)+addons.reduce((a,x)=>a+x.price,0);
  const disc=Math.min(sub,parseFloat(draft.discount)||0);
  const o={id:uid(),code:"LS-"+(state.counter++),customerId:draft.customerId||"",
    items,addons,subtotal:sub,discount:disc,total:sub-disc,
    paid:draft.paid,payMethod:draft.paid?draft.payMethod:"",
    status:"received",created:Date.now(),due:todayISO(),notes:draft.notes.trim(),log:[]};
  state.orders.push(o);save();
  workspace={type:"order",id:o.id};draft=null;render();
  toast("Order "+o.code+" created");
}

/* ============================== customers ============================== */
let custQuery="";

  let list=state.customers.slice().sort((a,b)=>a.name.localeCompare(b.name));

    <input class="search" id="custSearch" aria-label="Search customers" placeholder="Search customers…" value="${esc(custQuery)}">
    ${list.map(c=>{
      const os=state.orders.filter(o=>o.customerId===c.id);
      const spend=os.reduce((a,o)=>a+orderTotal(o),0);
      return `<div class="card ocard" data-opencust="${c.id}">
        <div class="row">
          <div class="grow">
            <div class="name">${esc(c.name)}</div>
            <div class="muted small">${esc(c.phone||"no phone")} · ${os.length} order${os.length===1?"":"s"}</div>
          </div>
          <div class="oamt">${peso(spend)}</div>
        </div>

}

}
function customerModal(existing,thenFn){
  const c=existing||{};
  openModal(`<h3>${existing?"Edit":"New"} customer</h3>
    <label class="f">Name *</label><input id="c-name" value="${esc(c.name||"")}" placeholder="Full name">
    <label class="f">Phone</label><input id="c-phone" inputmode="tel" value="${esc(c.phone||"")}" placeholder="09xx xxx xxxx">
    <label class="f">Notes</label><input id="c-notes" value="${esc(c.notes||"")}" placeholder="Preferences, allergies…">
    <button class="btn" style="width:100%;margin-top:14px" id="c-save">Save</button>`);
  $("#c-name").focus();
  $("#c-save").onclick=()=>{
    const name=$("#c-name").value.trim();
    if(!name){toast("Name is required");$("#c-name").focus();return;}
    if(existing){Object.assign(existing,{name,phone:$("#c-phone").value.trim(),notes:$("#c-notes").value.trim()});}
    else{const nc={id:uid(),name,phone:$("#c-phone").value.trim(),
      notes:$("#c-notes").value.trim(),created:Date.now()};
      state.customers.push(nc);
      if(thenFn){save();closeModal();thenFn(nc);return;}}
    save();closeModal();render();toast("Saved");
  };
}

/* ============================== reports ============================== */
function renderReports(){
  const now=new Date();now.setHours(0,0,0,0);
  const day=86400000;
  const range=(days)=>state.orders.filter(o=>o.created>=now.getTime()-(days-1)*day);
  const sum=os=>os.reduce((a,o)=>a+orderTotal(o),0);
  const w=range(7),m=range(30);
  // last 7 days bars
  let bars="";let maxd=0;const dvals=[];
  for(let i=6;i>=0;i--){
    const d0=now.getTime()-i*day,d1=d0+day;
    const v=sum(state.orders.filter(o=>o.created>=d0&&o.created<d1));
    dvals.push([new Date(d0).toLocaleDateString(undefined,{weekday:"short"}),v]);
    maxd=Math.max(maxd,v);
  }
  bars=dvals.map(([l,v])=>`<div class="bwrap"><div class="blabel">${l}</div>
    <div class="bar" style="width:${maxd?Math.round(v/maxd*100):0}%"></div>
    <div class="bval">${peso(v)}</div></div>`).join("");
  // top services (30d)
  const svcTot={};
  m.forEach(o=>o.items.forEach(i=>{svcTot[i.name]=(svcTot[i.name]||0)+i.amount;}));
  const tops=Object.entries(svcTot).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxs=tops.length?tops[0][1]:0;
  const unpaid=state.orders.filter(o=>!o.paid&&o.status!=="claimed")
    .sort((a,b)=>a.created-b.created);
  return `
    <div class="stats">
      <div class="stat"><div class="l">Last 7 days</div><div class="v">${peso(sum(w))}</div></div>
      <div class="stat"><div class="l">Last 30 days</div><div class="v">${peso(sum(m))}</div></div>
      <div class="stat"><div class="l">Orders (30d)</div><div class="v">${m.length}</div></div>
      <div class="stat"><div class="l">Avg order (30d)</div><div class="v">${peso(m.length?sum(m)/m.length:0)}</div></div>
    </div>
    <div class="card"><div class="name" style="margin-bottom:6px">Daily sales — last 7 days</div>${bars}</div>
    <div class="card"><div class="name" style="margin-bottom:6px">Top services — 30 days</div>
      ${tops.map(([n,v])=>`<div class="bwrap"><div class="blabel">${esc(n)}</div>
        <div class="bar" style="width:${maxs?Math.round(v/maxs*100):0}%"></div>
        <div class="bval">${peso(v)}</div></div>`).join("")||`<div class="muted small">No data yet.</div>`}
    </div>
    <div class="sechead">Unpaid orders ${unpaid.length?`<span class="pay-pill pay-unpaid">${unpaid.length}</span>`:""}</div>
    ${unpaid.map(orderCard).join("")||`<div class="card muted small"><i class="ri-checkbox-circle-line"></i> All caught up — nothing unpaid.</div>`}
    <div class="row" style="gap:8px;margin-top:14px">
      <button class="btn sm ghost" id="exportBtn">Export backup</button>
      <button class="btn sm ghost" id="importBtn">Import</button>
      <input type="file" id="importFile" accept="application/json" hidden>
    </div>`;
}

/* ============================== export/import ============================== */
function exportJSON(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`laundry-backup-${todayISO()}.json`;
  a.click();URL.revokeObjectURL(a.href);
}
// Accept only SudsFlow-shaped backups. An arbitrary JSON file must never
// replace orders, customers, prices, or settings with normalized defaults.
function isValidLaundryBackup(data){
  if(!data||typeof data!=="object"||Array.isArray(data))return false;
  const groups=["services","addons","customers","orders"];
  if(!groups.every(key=>Array.isArray(data[key])&&data[key].every(
    row=>row&&typeof row==="object"&&!Array.isArray(row))))return false;
  if(data.settings!=null&&(typeof data.settings!=="object"||Array.isArray(data.settings)))return false;
  if(!data.services.every(item=>typeof item.id==="string"&&typeof item.name==="string"))return false;
  if(!data.addons.every(item=>typeof item.id==="string"&&typeof item.name==="string"))return false;
  if(!data.customers.every(item=>typeof item.id==="string"&&typeof item.name==="string"))return false;
  if(!data.orders.every(order=>typeof order.id==="string"&&Array.isArray(order.items)&&
    order.items.every(item=>item&&typeof item==="object"&&!Array.isArray(item))&&
    (order.addons==null||Array.isArray(order.addons))))return false;
  return true;
}
function importJSON(file){
  const r=new FileReader();
  r.onload=()=>{
    let data;
    try{data=JSON.parse(r.result);}
    catch(e){toast("Invalid JSON backup. Existing data was not changed.");return;}
    if(!isValidLaundryBackup(data)){
      toast("Not a valid SudsFlow backup. Existing data was not changed.");return;
    }
    if(!confirm("Replace all current data with the imported file?"))return;
    // Commit storage first. If quota/access is denied, retain the in-memory
    // workspace as well as the previous saved data instead of losing orders.
    let restored;
    try{
      restored=normalize(data);
      const serialized=JSON.stringify(restored);
      localStorage.setItem(LS,serialized);
      if(localStorage.getItem(LS)!==serialized)throw Error("Storage write not confirmed");
    }catch(e){toast("Import could not be saved or verified. The active workspace was not changed.");return;}
    state=restored;
    render();toast("Imported");
  };
  r.onerror=()=>toast("Unable to read backup. Existing data was not changed.");
  r.readAsText(file);
}

/* ============================== modal ============================== */
let modalRestoreFocus=null;
function openModal(html){
  // Remember the launch control so keyboard users return to their work.
  if(!$("#modalRoot").innerHTML)modalRestoreFocus=document.activeElement;
  $("#modalRoot").innerHTML=`
    <div class="backdrop" id="mBack">
      <div class="modal" role="dialog" aria-modal="true" aria-label="SudsFlow dialog" tabindex="-1">
        <button class="icon close" id="mClose" aria-label="Close"><i class="ri-close-line"></i></button>${html}
      </div></div>`;
  $("#mBack").onclick=e=>{if(e.target.id==="mBack")closeModal();};
  $("#mClose").onclick=closeModal;
  const dialog=$("#mBack .modal");
  dialog.addEventListener("keydown",e=>{
    if(e.key==="Escape"){e.preventDefault();closeModal();return;}
    if(e.key!=="Tab")return;
    const controls=Array.from(dialog.querySelectorAll(
      'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])'
    )).filter(el=>!el.hidden&&el.getClientRects().length);
    if(!controls.length){e.preventDefault();dialog.focus();return;}
    const first=controls[0],last=controls[controls.length-1];
    if(e.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){
      e.preventDefault();last.focus();
    }else if(!e.shiftKey&&(document.activeElement===last||!dialog.contains(document.activeElement))){
      e.preventDefault();first.focus();
    }
  });
  $("#mClose").focus();
}
function closeModal(){
  $("#modalRoot").innerHTML="";
  if(modalRestoreFocus?.isConnected)modalRestoreFocus.focus();
  modalRestoreFocus=null;
}

/* ============================== FAB ============================== */
function renderFab(){
  const fab=$("#fab");
  let action=null,label="";
  if(workspace&&workspace.type==="neworder"){fab.style.display="none";return;}
  if(workspace&&workspace.type==="order"){fab.style.display="none";return;}
  if(workspace&&workspace.type==="customer"){fab.style.display="none";return;}
  if(view==="customers"){action=()=>customerModal();label="New customer";}
  else{action=()=>startDraft();label="New order";}
  fab.innerHTML=`<i class="ri-add-line" aria-hidden="true"></i><span>${label}</span>`;
  fab.style.display="";fab.onclick=action;
}

/* ============================== wiring ============================== */
function wire(){
  $$("[data-tab]").forEach(b=>b.onclick=()=>go(b.dataset.tab));
  $("#backBtn")&&($("#backBtn").onclick=back);
  $("#settingsBtn")&&($("#settingsBtn").onclick=settingsModal);
  $("#sideSettings")&&($("#sideSettings").onclick=settingsModal);
  $("#headerPrimary")&&($("#headerPrimary").onclick=e=>{
    if(e.currentTarget.dataset.action==="customer")customerModal();else startDraft();});
  $$("[data-openorder]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-adv]"))return;
    workspace={type:"order",id:el.dataset.openorder};render();});
  $$("[data-opencust]").forEach(el=>el.onclick=()=>{
    workspace={type:"customer",id:el.dataset.opencust};render();});
  $$("[data-adv]").forEach(b=>b.onclick=e=>{e.stopPropagation();advance(b.dataset.adv);});
  $("[data-filter]").forEach(b=>b.onclick=()=>{
    const selected=b.dataset.filter;
    orderFilter=selected;render();
    const replacement=Array.from($("[data-filter]")).find(chip=>chip.dataset.filter===selected);
    replacement?.focus({preventScroll:true});
  });
  const os=$("#orderSearch");
  if(os){os.oninput=()=>{orderQuery=os.value;
    const keep=os.selectionStart;render();
    const n=$("#orderSearch");n.focus();n.setSelectionRange(keep,keep);};}
  const cs=$("#custSearch");
  if(cs){cs.oninput=()=>{custQuery=cs.value;
    const keep=cs.selectionStart;render();
    const n=$("#custSearch");n.focus();n.setSelectionRange(keep,keep);};}

  /* order detail */
  const od=workspace&&workspace.type==="order"?state.orders.find(o=>o.id===workspace.id):null;
  if(od){
    $("#togglePaid")&&($("#togglePaid").onclick=()=>{
      od.paid=!od.paid;od.payMethod=od.paid?"Cash":"";save();render();
      toast(od.paid?"Marked paid":"Marked unpaid");});
    $("#viewReceipt")&&($("#viewReceipt").onclick=()=>openReceipt(od));
    $("#notifyBtn")&&($("#notifyBtn").onclick=()=>openNotify(od));
    $("#delOrder")&&($("#delOrder").onclick=()=>{
      if(!confirm("Delete order "+od.code+"?"))return;
      state.orders=state.orders.filter(o=>o.id!==od.id);
      save();workspace=null;view="orders";render();toast("Order deleted");});
  }
  /* customer detail */
  const cd=workspace&&workspace.type==="customer"?custById(workspace.id):null;
  if(cd){
    $("#editCust")&&($("#editCust").onclick=()=>customerModal(cd));
    $("#delCust")&&($("#delCust").onclick=()=>{
      if(!confirm("Delete "+cd.name+"? Their orders stay but lose the link."))return;
      state.customers=state.customers.filter(c=>c.id!==cd.id);
      save();workspace=null;view="customers";render();toast("Customer deleted");});
    $("#newOrderForCust")&&($("#newOrderForCust").onclick=()=>startDraft(cd.id));
  }
  /* new order */
  if(workspace&&workspace.type==="neworder"&&draft){
    $("#d-cust").onchange=e=>{draft.customerId=e.target.value;};
    $("#d-newcust").onclick=()=>customerModal(null,nc=>{
      draft.customerId=nc.id;render();toast("Customer added");});
    $$("[data-line-svc]").forEach(sel=>sel.onchange=()=>{
      draft.items[+sel.dataset.lineSvc].serviceId=sel.value;refreshDraftTotals();});
    $$("[data-line-qty]").forEach(inp=>inp.oninput=()=>{
      draft.items[+inp.dataset.lineQty].qty=inp.value;refreshDraftTotals();});
    const bump=(i,delta)=>{
      const it=draft.items[i];
      const s=state.services.find(x=>x.id===it.serviceId);
      const step=s&&s.unit==="pc"?1:0.5;
      const v=Math.max(0,(parseFloat(it.qty)||0)+delta*step);
      it.qty=v?String(v):"";
      const inp=$(`[data-line-qty="${i}"]`);if(inp)inp.value=it.qty;
      refreshDraftTotals();};
    $$("[data-line-inc]").forEach(b=>b.onclick=()=>bump(+b.dataset.lineInc,1));
    $$("[data-line-dec]").forEach(b=>b.onclick=()=>bump(+b.dataset.lineDec,-1));
    $$("[data-line-preset]").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.linePreset;
      draft.items[i].qty=b.dataset.presetVal;
      const inp=$(`[data-line-qty="${i}"]`);if(inp)inp.value=b.dataset.presetVal;
      refreshDraftTotals();});
    $$("[data-line-del]").forEach(b=>b.onclick=()=>{
      draft.items.splice(+b.dataset.lineDel,1);render();});
    $("#d-addline").onclick=()=>{
      draft.items.push({serviceId:state.services[0].id,qty:""});render();};
    $$("[data-addon]").forEach(b=>b.onclick=()=>{
      const id=b.dataset.addon;
      const i=draft.addonIds.indexOf(id);
      if(i>=0)draft.addonIds.splice(i,1);else draft.addonIds.push(id);
      b.classList.toggle("on");refreshDraftTotals();});
    $("#d-disc").oninput=e=>{draft.discount=e.target.value;refreshDraftTotals();};
    $("#d-pay").onchange=e=>{
      if(e.target.value==="later"){draft.paid=false;draft.payMethod="";}
      else{draft.paid=true;draft.payMethod=e.target.value;}};
    $("#d-notes").oninput=e=>{draft.notes=e.target.value;};
    $("#d-save").onclick=saveDraft;
  }
  /* export/import */
  $("#exportBtn")&&($("#exportBtn").onclick=exportJSON);
  $("#importBtn")&&($("#importBtn").onclick=()=>$("#importFile").click());
  $("#importFile")&&($("#importFile").onchange=e=>{
    if(e.target.files[0])importJSON(e.target.files[0]);e.target.value="";});
}

render();
</script>
